{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa sin consumos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-lg border-0" style="max-width: 450px;">
        <div class="card-body text-center p-5">
            <i class="fa-solid fa-triangle-exclamation text-warning mb-3" style="font-size: 4rem;"></i>
            <h3 class="fw-bold mb-3">Mesa Abierta y Vacía</h3>
            <p class="text-secondary mb-4">La Mesa {{ numero }} tiene una cuenta abierta pero no se han registrado consumos.</p>
            
            <form method="POST">
                {% csrf_token %}
                <div class="d-grid gap-3">
                    <button type="submit" name="accion" value="anular" class="btn btn-danger btn-lg fw-bold">
                        <i class="fa-solid fa-trash-can me-2"></i> Anular Cuenta (Liberar Mesa)
                    </button>
                    <button type="submit" name="accion" value="entrar" class="btn btn-primary btn-lg fw-bold">
                        <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Continuar Editando
                    </button>
                </div>
            </form>
            <a href="{% url 'seleccion_mesas' %}" class="btn btn-link mt-3 text-secondary">Volver Atrás</a>
        </div>
    </div>
</body>
</html>
