{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubiertos - {{ nombre_local }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f8fafc; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .teclado-container {
            width: 100%;
            max-width: 380px;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        
        /* Pantalla donde se ven los números */
        .pantalla-cubiertos {
            background-color: #f1f5f9;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px 20px;
            font-size: 3rem;
            font-weight: 700;
            color: #8B1E1E; /* Color Guinda */
            text-align: right;
            margin-bottom: 20px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            letter-spacing: 2px;
        }
        
        /* Estilos de las teclas */
        .btn-tecla {
            height: 70px;
            font-size: 1.8rem;
            font-weight: bold;
            border-radius: 12px;
            color: #334155;
            background-color: white;
            border: 2px solid #e2e8f0;
            transition: all 0.1s;
        }
        .btn-tecla:active {
            background-color: #f1f5f9;
            transform: scale(0.95);
            border-color: #cbd5e1;
        }

        /* Teclas especiales */
        .tecla-borrar { color: #ef4444; }
        .tecla-aceptar {
            background-color: #10b981; /* Verde */
            color: white;
            border: none;
        }
        .tecla-aceptar:active { background-color: #059669; }
        .tecla-cancelar {
            background-color: #ef4444; /* Rojo */
            color: white;
            border: none;
        }
        .tecla-cancelar:active { background-color: #dc2626; }
    </style>
</head>
<body>
    <div class="teclado-container">
        <h4 class="fw-bold text-center text-dark mb-1">Mesa {{ numero }}</h4>
        <p class="text-secondary text-center mb-3">Ingrese cantidad de cubiertos</p>

        <div class="pantalla-cubiertos" id="displayCubiertos"></div>

        <form id="formCubiertos" method="POST">
            {% csrf_token %}
            <input type="hidden" name="cubiertos" id="inputCubiertos" value="">
        </form>

        <div class="row g-2">
            <div class="col-4"><button type="button" class="btn btn-tecla w-100" onclick="agregarNumero('7')">7</button></div>
            <div class="col-4"><button type="button" class="btn btn-tecla w-100" onclick="agregarNumero('8')">8</button></div>
            <div class="col-4"><button type="button" class="btn btn-tecla w-100" onclick="agregarNumero('9')">9</button></div>
            
            <div class="col-4"><button type="button" class="btn btn-tecla w-100" onclick="agregarNumero('4')">4</button></div>
            <div class="col-4"><button type="button" class="btn btn-tecla w-100" onclick="agregarNumero('5')">5</button></div>
            <div class="col-4"><button type="button" class="btn btn-tecla w-100" onclick="agregarNumero('6')">6</button></div>
            
            <div class="col-4"><button type="button" class="btn btn-tecla w-100" onclick="agregarNumero('1')">1</button></div>
            <div class="col-4"><button type="button" class="btn btn-tecla w-100" onclick="agregarNumero('2')">2</button></div>
            <div class="col-4"><button type="button" class="btn btn-tecla w-100" onclick="agregarNumero('3')">3</button></div>
            
            <div class="col-4"><button type="button" class="btn btn-tecla tecla-borrar w-100" onclick="borrarNumero()"><i class="fa-solid fa-delete-left"></i></button></div>
            <div class="col-4"><button type="button" class="btn btn-tecla w-100" onclick="agregarNumero('0')">0</button></div>
            <div class="col-4"><button type="button" class="btn btn-tecla tecla-aceptar w-100" onclick="confirmarYEnviar()"><i class="fa-solid fa-check"></i></button></div>
        </div>
        
        <div class="mt-3">
            <a href="{% url 'seleccion_mesas' %}" class="btn btn-tecla tecla-cancelar w-100"><i class="fa-solid fa-xmark me-2"></i>Cancelar</a>
        </div>
    </div>

    <script>
        let valorActual = "";
        const display = document.getElementById('displayCubiertos');

        function actualizarPantalla() {
            // Mostramos el valor, y si está vacío, un cursor parpadeante visual
            display.innerText = valorActual === "" ? "" : valorActual;
        }

        function agregarNumero(num) {
            // Evitamos que empiece con 0 o que metan más de 3 dígitos (ej: 999 cubiertos)
            if (valorActual === "" && num === "0") return;
            if (valorActual.length >= 3) return;
            
            valorActual += num;
            actualizarPantalla();
        }

        function borrarNumero() {
            // Borra el último carácter
            valorActual = valorActual.slice(0, -1);
            actualizarPantalla();
        }

        function confirmarYEnviar() {
            if (valorActual === "" || parseInt(valorActual) === 0) {
                alert("Debe ingresar al menos 1 cubierto.");
                return;
            }
            // Guarda el valor en el input oculto y envía el formulario a Django
            document.getElementById('inputCubiertos').value = valorActual;
            document.getElementById('formCubiertos').submit();
        }
    </script>
</body>
</html>
