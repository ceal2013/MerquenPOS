{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubiertos - {{ nombre_local }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; }
        .teclado-container {
            max-width: 400px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .btn-tecla {
            height: 80px;
            font-size: 2rem;
            font-weight: bold;
            border-radius: 12px;
            color: #334155;
            background-color: #f1f5f9;
            border: 2px solid #e2e8f0;
            transition: all 0.1s;
        }
        .btn-tecla:active {
            background-color: #e2e8f0;
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="teclado-container text-center">
            <h3 class="fw-bold mb-1 text-dark">Mesa {{ numero }}</h3>
            <p class="text-secondary mb-4">¿Cuántos cubiertos?</p>

            <form id="formCubiertos" method="POST">
                {% csrf_token %}
                <input type="hidden" name="cubiertos" id="inputCubiertos" value="1">
            </form>

            <div class="row g-3">
                {% for i in "123456789"|make_list %}
                <div class="col-4">
                    <button type="button" class="btn btn-tecla w-100" onclick="enviarCubiertos('{{ i }}')">{{ i }}</button>
                </div>
                {% endfor %}
            </div>
            
            <div class="mt-4">
                <a href="{% url 'seleccion_mesas' %}" class="btn btn-outline-danger w-100 py-3 fw-bold">Cancelar</a>
            </div>
        </div>
    </div>

    <script>
        function enviarCubiertos(cantidad) {
            document.getElementById('inputCubiertos').value = cantidad;
            document.getElementById('formCubiertos').submit();
        }
    </script>
</body>
</html>
