{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MerquenPOS - Iniciar Sesión</title>
    
    <link rel="icon" href="{% static 'merquenicono.png' %}" type="image/png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Colores ajustados al estilo HotelNew pero versión Merquén */
            --color-primario: #8B1E1E; /* Rojo oscuro/guinda del ají */
            --color-boton: #10b981;    /* Verde HotelNew (Combina con el logo de Merquén) */
            --color-boton-hover: #059669;
            --color-fondo: #f1f5f9;
        }

        body, html {
            height: 100%;
            overflow: hidden; 
            background-color: var(--color-fondo);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* --- LADO IZQUIERDO (Estilo HotelNew) --- */
        .logo-side {
            background-color: var(--color-primario); 
        }

        .logo-container {
            background-color: white; 
            border-radius: 16px;      /* Bordes redondeados como en HotelNew */
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        .logo {
            max-width: 180px; 
            height: auto;
        }

        /* --- LADO DERECHO (TARJETA Y FORMULARIO) --- */
        .login-card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
        }

        .form-control-tablet, .form-select-tablet {
            padding: 16px;
            font-size: 1.2rem;
            border-radius: 8px;
            border: 2px solid #cbd5e1;
            background-color: #f8fafc;
            color: #334155;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control-tablet:focus, .form-select-tablet:focus {
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            outline: none;
        }

        .btn-merquen {
            background-color: var(--color-boton);
            border: none;
            color: white;
            padding: 18px;
            font-size: 1.3rem;
            font-weight: 700;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .btn-merquen:hover {
            background-color: var(--color-boton-hover);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0 h-100">
        <div class="row g-0 h-100">
            
            <div class="col-md-5 d-none d-md-flex flex-column align-items-center justify-content-center logo-side text-white p-5 shadow-lg">
                <div class="logo-container">
                    <img src="{% static 'logomerquen.png' %}" alt="Logo MerquenPOS" class="logo">
                </div>
                
                <h1 class="h3 fw-bold mt-3 text-white">MerquenPOS App</h1>
                <p class="text-center text-white mt-2" style="font-size: 1.15rem; letter-spacing: 0.5px; text-transform: uppercase;">
                    {{ nombre_local }}
                </p>
            </div>
            
            <div class="col-md-7 d-flex align-items-center justify-content-center">
                <div class="login-card">
                    
                    <div class="text-center d-md-none mb-4">
                        <div class="logo-container" style="padding: 15px; margin-bottom: 0;">
                            <img src="{% static 'logomerquen.png' %}" alt="Logo MerquenPOS" style="max-width: 140px;">
                        </div>
                        <h1 class="h4 fw-bold mt-3 mb-0" style="color: var(--color-primario);">MerquenPOS App</h1>
                    </div>

                    <h2 class="text-center mb-1" style="color: var(--color-primario); font-weight: 700;">Iniciar Sesión</h2>
                    
                    <p class="text-center text-muted mb-4 d-md-none fw-semibold" style="text-transform: uppercase;">
                        {{ nombre_local }}
                    </p>
                    
                    {% if error %}
                        <div class="alert alert-danger shadow-sm border-0 fw-semibold text-center">{{ error }}</div>
                    {% endif %}

                    <form method="post" action="{% url 'login' %}">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <label for="usuario" class="form-label text-secondary fw-semibold mb-2">Seleccione su Usuario</label>
                            <select class="form-select form-select-tablet" id="usuario" name="usuario" required>
                                <option value="" selected disabled>-- Toque para elegir --</option>
                                {% for user in usuarios %}
                                    <option value="{{ user.nombre }}">{{ user.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-4">
                            <label for="password" class="form-label text-secondary fw-semibold mb-2">Contraseña</label>
                            <input type="password" class="form-control form-control-tablet" id="password" name="password" placeholder="Ingrese su contraseña" required>
                        </div>
                        
                        <button type="submit" class="btn btn-merquen w-100 mt-3 shadow-sm">Entrar al Sistema</button>
                    </form>
                </div>
            </div>
            
        </div>
    </div>
</body>
</html>
