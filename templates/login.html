{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MerquenPOS - Iniciar Sesión</title>
    
    <link rel="icon" href="{% static 'merquenicono.png' %}" type="image/png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* NUEVA PALETA DE COLORES RECOMENDADA */
            --color-texto-principal: #2d3436; /* Un grafito más suave */
            --color-naranja-boton: #e65100;    /* Tu naranja fuego Merquén */
            --color-naranja-hover: #bf360c;
            --color-fondo: #f1f5f9;           /* Fondo general claro */
            --color-fondo-izq: #ffffff;      /* NUEVO: Panel izquierdo limpio */
        }

        body, html {
            height: 100%;
            overflow: hidden; 
            background-color: var(--color-fondo);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--color-texto-principal);
        }

        /* --- LADO IZQUIERDO RE-DISEÑADO --- */
        .logo-side {
            background-color: var(--color-fondo-izq); /* Panel limpio y blanco */
            border-right: 1px solid #e2e8f0;           /* Divisor sutil */
        }

        /* Contenedor circular blanco para el logo verde */
        .logo-holder {
            background-color: white; 
            border-radius: 50%;          /* Círculo perfecto */
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); /* Sombra elegante */
            display: inline-block;
            margin-bottom: 25px;
        }

        .logo {
            max-width: 180px;            /* Logo más contenido */
            height: auto;
        }

        /* --- LADO DERECHO (TARJETA Y FORMULARIO) --- */
        .login-card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
        }

        /* Campos gigantes para Tablet */
        .form-control-tablet, .form-select-tablet {
            padding: 16px;
            font-size: 1.2rem;
            border-radius: 8px;
            border: 2px solid #cbd5e1;
            background-color: #f8fafc;
            color: #334155;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control-tablet:focus, .form-select-tablet:focus {
            border-color: var(--color-naranja-boton);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(230, 81, 0, 0.15);
            outline: none;
        }

        /* Botón estilo "Grabar" Merquén */
        .btn-merquen {
            background-color: var(--color-naranja-boton);
            border: none;
            color: white;
            padding: 18px;
            font-size: 1.3rem;
            font-weight: 700;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .btn-merquen:hover {
            background-color: var(--color-naranja-hover);
            color: white;
        }

        /* Estilo de los textos principales */
        .fw-bold { color: var(--color-texto-principal); }
        .text-orange { color: var(--color-naranja-boton); }
    </style>
</head>
<body>
    <div class="container-fluid p-0 h-100">
        <div class="row g-0 h-100">
            
            <div class="col-md-5 d-none d-md-flex flex-column align-items-center justify-content-center logo-side p-5">
                
                <div class="logo-holder">
                    <img src="{% static 'logomerquen.png' %}" alt="Logo MerquenPOS" class="logo">
                </div>

                <h1 class="h3 fw-bold mt-3">
                    <span class="text-orange">Punto</span> de Venta Web
                </h1>
                <p class="lead text-center opacity-75">Toma de pedidos en mesa rápida y eficiente.</p>
            </div>
            
            <div class="col-md-7 d-flex align-items-center justify-content-center">
                <div class="login-card">
                    
                    <div class="text-center d-md-none mb-4">
                        <img src="{% static 'logomerquen.png' %}" alt="Logo MerquenPOS" style="max-width: 140px;">
                    </div>

                    <h2 class="text-center mb-4" style="color: var(--color-texto-principal); font-weight: 700;">Iniciar Sesión</h2>
                    
                    {% if error %}
                        <div class="alert alert-danger shadow-sm border-0 fw-semibold text-center">{{ error }}</div>
                    {% endif %}

                    <form method="post" action="{% url 'login' %}">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <label for="usuario" class="form-label text-secondary fw-semibold mb-2">Seleccione su Usuario</label>
                            <select class="form-select form-select-tablet" id="usuario" name="usuario" required>
                                <option value="" selected disabled>-- Toque para elegir --</option>
                                {% for user in usuarios %}
                                    <option value="{{ user.nombre }}">{{ user.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-4">
                            <label for="password" class="form-label text-secondary fw-semibold mb-2">Contraseña</label>
                            <input type="password" class="form-control form-control-tablet" id="password" name="password" placeholder="Ingrese su contraseña" required>
                        </div>
                        
                        <button type="submit" class="btn btn-merquen w-100 mt-3 shadow-sm">Entrar al Sistema</button>
                    </form>
                </div>
            </div>
            
        </div>
    </div>
</body>
</html>
